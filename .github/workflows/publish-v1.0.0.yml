name: Publish v1.0.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.0.0.yml']
  workflow_dispatch:
permissions: {}
jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Attach bundled dependency notices
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload v1.0.0 THIRD-PARTY-NOTICES.txt --repo "$env:GH_REPO"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
